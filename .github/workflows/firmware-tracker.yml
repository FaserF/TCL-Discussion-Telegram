name: Firmware Tracker

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 04:00 UTC (06:00 CEST / 05:00 CET)
  workflow_dispatch:        # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  track-firmwares:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run TCL TV Firmware Tracker & Telegram Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python scripts/fetch_firmwares.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmwares.md docs/assets/firmwares.json docs/assets/news.json
          if git diff --staged --quiet; then
            echo "No changes in firmware data."
          else
            git commit -m "chore(tracker): auto-update TCL TV firmware status & banner [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
