name: Update News Banner

on:
  workflow_dispatch:
    inputs:
      active:
        description: 'Show Banner?'
        required: true
        type: boolean
        default: true
      text:
        description: 'Banner Text (Leave empty for LIVE latest Telegram post)'
        required: false
        default: ''
      link:
        description: 'Link URL (optional)'
        required: false
        default: ''

jobs:
  update-news:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    permissions:
      contents: write
    steps:
      - name: Install Dependencies
        run: |
          apk add --no-cache python3 py3-pip py3-requests py3-beautifulsoup4 jq git

      - uses: actions/checkout@v4

      - name: Fetch Live Data (if needed)
        id: news-data
        run: |
          ACTIVE="${{ inputs.active }}"
          TEXT="${{ inputs.text }}"
          LINK="${{ inputs.link }}"
          DATE=$(date +'%Y-%m-%d')

          if [ "$ACTIVE" = "true" ] && [ -z "$TEXT" ]; then
            echo "Fetching live telegram data..."
            python3 scripts/fetch_telegram.py > live_news.json
            LIVE_TEXT=$(jq -r '.text' live_news.json)
            LIVE_LINK=$(jq -r '.link' live_news.json)
            TEXT="$LIVE_TEXT"
            LINK="$LIVE_LINK"
          fi

          mkdir -p docs/assets
          jq -n \
            --arg active "$ACTIVE" \
            --arg date "$DATE" \
            --arg text "$TEXT" \
            --arg link "$LINK" \
            '{active: ($active == "true"), date: $date, text: $text, link: $link}' \
            > docs/assets/news.json

      - name: Commit and Push
        run: |
          git config --global --add safe.directory "$PWD"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/assets/news.json
          git commit -m "news: update banner [skip ci]" || echo "No changes to commit"
          git push
